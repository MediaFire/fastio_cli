[package]
name = "fastio-cli"
version = "0.2.84"
edition = "2024"
rust-version = "1.88"
description = "Command-line interface for the Fast.io cloud storage platform"
license = "Apache-2.0"
authors = ["Fast.io <support@fast.io>"]
homepage = "https://fast.io"
keywords = ["cli", "cloud-storage", "fast-io", "file-management", "mcp"]
categories = ["command-line-utilities"]
readme = "README.md"
# repository = "https://github.com/MediaFire/fastio_cli"

[[bin]]
name = "fastio"
path = "src/bin/fastio/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
comfy-table = "7"
csv = "1"
dirs = "6"
futures-util = "0.3"
indicatif = "0.18"
getrandom_crate = { package = "getrandom", version = "0.2" }
open = "5"
openssl = { version = "0.10", features = ["vendored"], optional = true }
# reqwest 0.13 switched its `default-tls` to rustls; this crate stays on the
# native-tls backend (platform TLS; OpenSSL on Linux), so defaults are off
# and 0.12's default set is re-enabled explicitly (`native-tls-no-alpn` matches
# 0.12's ALPN-less `default-tls`). `query` and `form` became opt-in features in 0.13.
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls-no-alpn",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "form",
    "query",
    "stream",
    "multipart",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
termimad = "0.35"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.2"
urlencoding = "2"

[features]
default = []
vendored-openssl = ["openssl"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
