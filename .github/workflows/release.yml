name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Cargo.toml and npm/package.json must agree, and a tag must name that
      # version, so a mismatched tag builds and publishes nothing.
      - name: Check tag, Cargo.toml and npm/package.json versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version=$(awk '/^\[/ { in_pkg = ($0 == "[package]") } in_pkg && /^version *=/ { gsub(/^version *= *"|".*$/, ""); print; exit }' Cargo.toml)
          npm_version=$(node -p 'require("./npm/package.json").version')
          echo "Cargo.toml: ${cargo_version:-<missing>}"
          echo "npm/package.json: ${npm_version:-<missing>}"
          if [ -z "$cargo_version" ] || [ -z "$npm_version" ]; then
            echo "::error::Could not read the version from Cargo.toml or npm/package.json"
            exit 1
          fi
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and npm/package.json ($npm_version) versions differ"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$cargo_version" ]; then
              echo "::error::Tag $REF_NAME does not match version v$cargo_version"
              exit 1
            fi
            echo "Tag $REF_NAME matches"
          else
            echo "Not a tag ref ($REF_NAME); skipping tag comparison"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: fastio-darwin-arm64
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: fastio-darwin-x64
            use_cross: false

          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: fastio-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: fastio-linux-arm64
            use_cross: true

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: fastio-windows-x64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu perl make
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.use_cross && '--features vendored-openssl' || '' }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/fastio ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/fastio.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum fastio-* > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm package
        run: |
          cd npm
          npm publish --access public --provenance
